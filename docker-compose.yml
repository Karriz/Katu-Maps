services:
  tile-builder:
    build:
      context: .
      dockerfile: apps/tile-tools/Dockerfile
    profiles: [build]
    working_dir: /workspace/apps/tile-tools
    volumes:
      - ./data:/workspace/data
    environment:
      NLS_API_KEY: "${NLS_API_KEY:-}"
    command:
      - -lc
      - ./scripts/download-osm.sh && ./scripts/build-tiles.sh && ./scripts/download-dem.sh && ./scripts/build-dem.sh

  martin:
    image: ghcr.io/maplibre/martin:1.12.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/processed:/data:ro
    command:
      - /data/tampere.mbtiles
      - /data/transport-surfaces.mbtiles
      - /data/terrain.mbtiles
    restart: unless-stopped
