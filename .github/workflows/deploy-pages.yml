name: Deploy map app to GitHub Pages

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/map-app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/map-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run unit tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/map-app/package-lock.json

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: apps/map-app
        run: npm ci

      - name: Build map app
        working-directory: apps/map-app
        env:
          VITE_APP_VERSION: ${{ github.ref_name }}
          VITE_DIGITRANSIT_SUBSCRIPTION_KEY: ${{ secrets.DIGITRANSIT_SUBSCRIPTION_KEY }}
          VITE_OPENCHARGEMAP_API_KEY: ${{ secrets.OPENCHARGEMAP_API_KEY }}
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"

      - name: Archive exact production files
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ASSET="production-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"
          jq -n --arg tag "$RELEASE_TAG" --arg sha "$RELEASE_SHA" --arg asset "$ASSET" \
            '{tag: $tag, sha: $sha, asset: $asset}' > apps/map-app/dist/deployment.json
          tar -czf "$ASSET" -C apps/map-app/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: production-archive
          path: production-*.tar.gz

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/map-app/dist

  deploy:
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: production-archive
          path: archive

      - name: Preserve production archive on tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes "Tagged Katu Maps release."
          gh release upload "$RELEASE_TAG" archive/production-*.tar.gz

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
